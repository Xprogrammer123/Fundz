<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funds</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Funds</h1>
        <p class="tagline">
          Local CSV import. Nothing is uploaded — this extension has no host
          permissions.
        </p>
      </header>

      <label class="file">
        <span>Import bank CSV</span>
        <input id="file" type="file" accept=".csv,text/csv" />
      </label>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="actions">
        <button id="export" type="button" disabled>Export Excel</button>
        <button id="wipe" type="button" class="danger">Wipe local</button>
      </div>

      <p class="foot">
        Full charts &amp; vault:
        <a id="web-link" href="http://localhost:5173" target="_blank" rel="noreferrer"
          >open web app</a
        >
      </p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
